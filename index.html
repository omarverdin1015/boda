<!-- SCRIPT TEMPORAL PARA SUBIR DATOS A FIREBASE -->
<script type="module">
  // Importamos la función setDoc para escribir documentos nuevos
  import { doc, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  window.subirInvitados = async function() {
    try {
      console.log("Leyendo archivo local...");
      // 1. Leemos tu archivo invitados.json (Asegúrate de que la ruta sea correcta)
      const respuesta = await fetch('invitados.json');
      const invitadosLocal = await respuesta.json();

      console.log(`Subiendo ${invitadosLocal.length} invitados a Firebase...`);

      // 2. Recorremos tu arreglo y los subimos uno por uno
      for (let inv of invitadosLocal) {
        // Creamos un documento en la colección "invitados" usando el ID de tu JSON
        const referencia = doc(window.db, "invitados", inv.id.toString());
        
        // Guardamos los datos
        await setDoc(referencia, inv);
        console.log(`✅ Subido: ${inv.nombre}`);
      }

      alert("¡Listo! Todos los invitados están en la nube. Revisa tu consola de Firebase.");
    } catch (error) {
      console.error("Hubo un error al subir los datos:", error);
      alert("Revisa la consola (F12) para ver el error.");
    }
  };
</script>
